name: Pipeline and release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  CUDA_VISIBLE_DEVICES: '-1'
  PYTHONDONTWRITEBYTECODE: '1'
  TF_CPP_MIN_LOG_LEVEL: '3'
  TF_NUM_INTRAOP_THREADS: '2'
  TF_NUM_INTEROP_THREADS: '2'
  OMP_NUM_THREADS: '2'
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . pytest
      - name: Framework-free import
        run: |
          python - <<'PY'
          import sys
          import sersd2d_superraman
          from sersd2d_superraman.data import SpectrumBatch
          assert 'tensorflow' not in sys.modules and 'torch' not in sys.modules
          PY
      - run: python -m pytest -q tests/test_contracts.py tests/test_stage_contracts.py tests/test_reliability.py
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[notebooks,dev]'
      - run: python -m ruff check src tests tools
      - run: python -m pytest -q
      - run: python -m sersd2d_superraman demo --output output/ci_demo
      - run: python tools/validate_notebooks.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python tools/release_contents.py
