[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sersd2d-superraman"
version = "0.1.0"
description = "Standalone SERS-D2DNet translation and SuperRaman analyte classification"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "h5py>=3.12,<4"]
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Sakib Mahmud"}]
classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
translation = ["tensorflow==2.21.0"]
classification = ["torch>=2.6,<3"]
all = ["tensorflow==2.21.0", "torch>=2.6,<3"]
xai = ["torch>=2.6,<3", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "build>=1.2", "twine>=6", "nbformat>=5.10", "nbclient>=0.10", "nbconvert>=7", "ipykernel>=6", "ruff>=0.9"]

[project.scripts]
sers-pipeline = "sersd2d_superraman.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["tensorflow: constructs TensorFlow models", "torch: requires PyTorch"]

[tool.ruff]
line-length = 110
extend-exclude = ["src/sersd2d_superraman/translation/_legacy_mlmrsnet.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/test_classifier.py" = ["E402"]
"tests/test_translation.py" = ["E402"]
